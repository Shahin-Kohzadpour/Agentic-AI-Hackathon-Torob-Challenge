services:
  torob-copilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: torob-in-person-copilot
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env.local
    volumes:
      - ./data:/app/data
